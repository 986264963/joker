<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Moark Web - 文生图精简版</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #111; color: #eee; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: #1e1e1e; padding: 20px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #333; }
        h2 { margin-top: 0; color: #61dafb; font-size: 1.2rem; }
        input, select, textarea { width: 100%; padding: 10px; margin: 5px 0; background: #252526; border: 1px solid #555; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { background: #007acc; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; margin-right: 10px; }
        button:hover { background: #005f9e; }
        #output { margin-top: 20px; }
        .item { background: #252526; padding: 15px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #444; }
        .item img { max-width: 100%; border-radius: 4px; margin-top: 10px; }
        .row { display: flex; gap: 10px; }
        .col { flex: 1; }
        #statusBadge { display: inline-block; padding: 5px 10px; border-radius: 4px; margin-bottom: 20px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <div id="statusBadge">准备就绪</div>
        
        <div class="card">
            <h2>全局设置</h2>
            <input type="password" id="apiKey" placeholder="输入 Gitee AI API Key">
            <label><input type="checkbox" id="rememberKey"> 记住 Key</label>
            <button id="btnClear">清空输出</button>
        </div>

        <!-- 1. Z-Image Turbo -->
        <div class="card">
            <h2>Z-Image Turbo (极速)</h2>
            <textarea id="zTurboPrompt" rows="2" placeholder="提示词..."></textarea>
            <select id="zTurboRes"></select>
            <button id="btnZTurbo">生成 Turbo</button>
        </div>

        <!-- 2. Z-Image Standard -->
        <div class="card">
            <h2>Z-Image Standard (标准)</h2>
            <textarea id="zStdPrompt" rows="2" placeholder="提示词..."></textarea>
            <div class="row">
                <div class="col"><select id="zStdRes"></select></div>
                <div class="col"><input type="number" id="zStdSteps" value="30" placeholder="步数"></div>
                <div class="col"><input type="number" id="zStdCfg" value="5" placeholder="CFG" step="0.1"></div>
            </div>
            <input type="number" id="zStdSeed" placeholder="Seed (留空随机)">
            <button id="btnZStd">生成 Standard</button>
        </div>

        <!-- 3. Qwen-Image -->
        <div class="card">
            <h2>Qwen-Image</h2>
            <textarea id="qwenPrompt" rows="2" placeholder="提示词..."></textarea>
            <div class="row">
                <div class="col"><select id="qwenRes"></select></div>
                <div class="col"><input type="number" id="qwenSteps" value="30" placeholder="步数"></div>
                <div class="col"><input type="number" id="qwenCfg" value="4" placeholder="CFG" step="0.1"></div>
            </div>
            <button id="btnQwen">生成 Qwen</button>
        </div>

        <!-- 4. Qwen-Image-2512 -->
        <div class="card">
            <h2>Qwen-Image-2512</h2>
            <textarea id="qwen2512Prompt" rows="2" placeholder="提示词..."></textarea>
            <div class="row">
                <div class="col"><select id="qwen2512Res"></select></div>
                <div class="col"><input type="number" id="qwen2512Steps" value="4" placeholder="步数"></div>
                <div class="col"><input type="number" id="qwen2512Cfg" value="1" placeholder="CFG" step="0.1"></div>
            </div>
            <button id="btnQwen2512">生成 Qwen-2512</button>
        </div>

        <div id="output"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
