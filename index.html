<!-- Z‑Image‑Turbo 独立面板 -->
<div id="panelZTurbo" class="panel" style="display:none;">
  <div>
    <label>分辨率</label>
    <select id="zTurboRes">
      <option>1:1 (2048x2048)</option>
      <option>1:1 (1024x1024)</option>
      <option>3:4 (768x1024)</option>
      <option>4:3 (1024x768)</option>
      <option>16:9 (1024x576)</option>
      <option>9:16 (576x1024)</option>
    </select>
  </div>
  <div>
    <label>步数</label>
    <input type="number" id="zTurboSteps" value="28">
  </div>
</div>
