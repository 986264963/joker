    <!-- Qwen-Image 面板 -->
    <section class="card model-panel" id="panelQwenImage">
      <h2>Qwen-Image（文生图）</h2>
      <label class="lab">提示词 Prompt</label>
      <textarea id="qiPrompt" class="textarea" rows="5" placeholder="例如：一幅精致细腻的工笔画，画面中心是一株蓬勃生长的红色牡丹..."></textarea>
      <label class="lab">负面提示词 Negative Prompt</label>
      <textarea id="qiNeg" class="textarea" rows="2" placeholder="指导模型避免生成所描述的内容"></textarea>
      <div class="grid2">
        <div>
          <label class="lab">分辨率 Resolution</label>
          <select id="qiRes" class="input"></select>
        </div>
        <div>
          <label class="lab">张数 n（1-4）</label>
          <input id="qiN" class="input" type="number" min="1" max="4" value="1" />
        </div>
      </div>
      <div class="grid2">
        <div>
          <label class="lab">num_inference_steps（1-50）</label>
          <input id="qiSteps" class="input" type="number" min="1" max="50" value="4" />
        </div>
        <div>
          <label class="lab">cfg_scale（0-10）</label>
          <input id="qiCfg" class="input" type="number" min="0" max="10" step="0.5" value="1" />
        </div>
      </div>
      <div class="grid2">
        <div>
          <label class="lab">seed</label>
          <input id="qiSeed" class="input" type="number" value="0" />
        </div>
      </div>
      <div class="row">
        <button class="btn primary" id="btnQiRun">执行 / Generate</button>
      </div>
    </section>
