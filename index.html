<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="utf‑8"/>
<meta name="viewport" content="width=device‑width, initial‑scale=1.0"/>
<title>Image View</title>
<style>
*{box‑sizing:border‑box;margin:0;padding:0;}
body{font‑family:system‑ui,‑apple‑system,Segoe UI,Roboto,Helvetica,Arial,sans‑serif;background:#121214;color:#eee;padding:12px;max‑width:1100px;margin:0 auto;}
h2{font‑size:16px;margin:12px 0 8px;}
.card{background:#1e1e22;border‑radius:10px;padding:14px;margin‑bottom:14px;}
.row{display:flex;gap:10px;flex‑wrap:wrap;margin‑bottom:10px;align‑items:center;}
.grid2{display:grid;grid‑template‑columns:1fr 1fr;gap:10px;}
.input,select,.textarea{width:100%;background:#2a2a30;color:#fff;border:1px solid #444;border‑radius:6px;padding:9px;font‑size:14px;}
.textarea{min‑height:140px;resize:vertical;}
.btn{padding:9px 14px;border‑radius:6px;border:none;font‑size:14px;cursor:pointer;background:#383842;color:#fff;}
.btn.primary{background:#22aa88;}
.hint{font‑size:12px;color:#aaa;margin:6px 0;line‑height:1.5;}
#outputBox{border:1px solid #333;border‑radius:8px;padding:10px;min‑height:220px;max‑height:60vh;overflow‑y:auto;background:#17171a;}
#statusBadge{border:1px solid #666;border‑radius:6px;padding:6px 10px;font‑size:13px;display:inline‑block;}
.mono{font‑family:monospace;}
</style>
</head>
<body>
<div class="card">
    <h2>1. 输入 API Key / Enter API Key</h2>
    <div class="row">
        <input id="apiKey" class="input" placeholder="Bearer Token" />
        <label class="chk">
            <input type="checkbox" id="rememberKey" />
            记住 (localStorage)
        </label>
        <button class="btn" id="btnClearKey">清除</button>
    </div>
    <div class="hint">
        提示: 本工具默认通过同站点的 <span class="mono">/api/*</span> 代理转发到 <span class="mono">https://ai.gitee.com/serverless‑api</span>
    </div>
</div>

<section class="card">
    <h2>2. 选择模型 / Select Model</h2>
    <div class="row">
        <select id="modelSel" class="input">
            <option value="z‑image">z‑image（文生图 / Text‑to‑Image）</option>
            <option value="xl‑sd">SDXL写实人像（Juggernaut/CyberRealistic）</option>
            <option value="Edit‑2511">Edit‑2511（图像编辑 / Image Edit）</option>
            <option value="Wan2.2‑I2V‑A14B">Wan2.2‑I2V‑A14B（图生视频 / Image‑to‑Video）</option>
            <option value="HunyuanVideo‑1.5">HunyuanVideo‑1.5（文生视频 / Text‑to‑Video）</option>
        </select>
    </div>
</section>

<section class="card model‑panel" id="panelZ">
    <h2>z‑image（文生图 / Text‑to‑Image）</h2>
    <label class="lab">提示词 Prompt（中/英文均可 / CN&EN OK）</label>
    <textarea id="zPrompt" class="textarea" rows="6" placeholder="例如: 一只戴墨镜的柴犬，赛博朋克风格"></textarea>
    <div class="grid2">
        <div>
            <label class="lab">分辨率 Resolution</label>
            <select id="zRes" class="input"></select>
        </div>
        <div>
            <label class="lab">张数 n (1‑4)</label>
            <input id="zN" class="input" type="number" min="1" max="4" value="1" />
        </div>
    </div>
    <div class="grid2">
        <div>
            <label class="lab">迭代步数 steps</label>
            <input id="zSteps" class="input" type="number" min="1" max="50" value="28"/>
        </div>
        <div>
            <label class="lab">引导系数 guidance_scale</label>
            <input id="zCfg" class="input" type="number" min="1" max="20" step="0.5" value="7.0"/>
        </div>
    </div>
    <label class="lab">随机种子 seed（留空自动随机）</label>
    <input id="zSeed" class="input" placeholder="留空自动随机"/>
    <label class="lab">负面提示词 Negative prompt</label>
    <textarea id="zNeg" class="textarea" rows="4" placeholder="ugly, deformed, bad anatomy"></textarea>
    <div class="row">
        <button class="btn primary" id="btnZRun">执行 / Generate</button>
        <span id="statusBadge">就绪</span>
    </div>
</section>

<section class="card model‑panel" id="panelXl" style="display:none;">
    <h2>SDXL 写实人像（人体外景专用）</h2>
    <label class="lab">模型选择：</label>
    <select id="xlModelSel" class="input"></select>

    <div class="grid2">
        <div>
            <label class="lab">画布分辨率</label>
            <select id="xlRes" class="input"></select>
        </div>
        <div>
            <label class="lab">生成数量 n：(1‑4)</label>
            <input id="xlN" class="input" type="number" min="1" max="4" value="1" />
        </div>
    </div>
    <div class="grid2">
        <div>
            <label class="lab">迭代步数 steps：</label>
            <input id="xlSteps" class="input" type="number" min="1" max="50" value="28"/>
        </div>
        <div>
            <label class="lab">引导系数 guidance_scale：</label>
            <input id="xlCfg" class="input" type="number" min="1" max="20" step="0.5" value="7.0"/>
        </div>
    </div>
    <label class="lab">随机种子 seed（留空随机）：</label>
    <input id="xlSeed" class="input" placeholder="留空自动随机"/>

    <label class="lab">正向提示词（英文效果更佳）：</label>
    <textarea id="xlPrompt" class="textarea" rows="6"></textarea>

    <label class="lab">负面提示词：</label>
    <textarea id="xlNeg" class="textarea" rows="4">anime,cartoon,illustration,q‑version,child,teenager,deformed,bad anatomy,ugly,plastic skin,over‑smoothed skin,instagram filter,3d render,cgi,drawing,painting,watermark,text</textarea>

    <div class="row">
        <button class="btn primary" id="btnXlRun">开始生成SDXL人像</button>
        <span id="statusBadge">就绪</span>
    </div>
</section>

<section class="card">
    <h2>输出 / Output</h2>
    <div style="display:flex;justify‑content:space‑between;align‑items:center;margin‑bottom:8px;">
        <span></span>
        <button class="btn" id="btnClearOut">清空输出</button>
    </div>
    <div id="outputBox"></div>
</section>

<script src="./app.js"></script>
</body>
</html>
